<title>Experience | Manaswi Makkena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0}
body{background:#141415}
*{box-sizing:border-box}
a{color:inherit}
#root{position:relative;height:100vh;min-height:620px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#222224 0%,#141415 100%);color:#F4F4F2;font-family:'Manrope',system-ui,sans-serif}
.wash{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 12% 10%,rgba(225,6,0,.22),transparent 30%),radial-gradient(circle at 90% 70%,rgba(192,192,192,.14),transparent 34%),radial-gradient(circle at 30% 95%,rgba(225,6,0,.12),transparent 30%);background-size:170% 170%;animation:wm 16s ease-in-out infinite alternate}
@keyframes wm{0%{background-position:0 0}100%{background-position:100% 100%}}
.nl{color:#F4F4F2;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.nl:hover,.nl.on{border-bottom-color:#E10600}
h1{margin:0;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.035em}
#road{position:relative;z-index:2;flex:0 0 clamp(250px,39vh,410px);margin:0 0 0}
#svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dash{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #F4F4F2;background:#2A2A2A;cursor:pointer;padding:0;transition:background .3s,transform .3s,box-shadow .3s;z-index:4}
.pin.done{background:#E10600}
.pin.sel{background:#E10600;transform:scale(1.35);box-shadow:0 0 0 8px rgba(225,6,0,.28)}
.pin:hover{transform:scale(1.25)}
.lab{position:absolute;z-index:4;width:clamp(170px,23%,330px);margin-left:calc(clamp(170px,23%,330px) / -2);text-align:center;cursor:pointer;background:none;border:0;color:#F4F4F2;font-family:inherit;padding:0;transition:opacity .3s}
.lab .d{font-size:clamp(13px,1.7vh,18px);font-weight:700;color:#FF5A4D}
.lab .t{font-size:clamp(16px,2.3vh,26px);font-weight:800;line-height:1.15;margin-top:2px}
.lab .o{font-size:clamp(13px,1.75vh,19px);font-weight:600;color:#D8D8D6;margin-top:2px}
.lab.dim{opacity:.62}
#rider{position:absolute;z-index:6;width:clamp(52px,7.5vh,84px);height:clamp(52px,7.5vh,84px);margin:calc(clamp(52px,7.5vh,84px) * -0.5) 0 0 calc(clamp(52px,7.5vh,84px) * 0.35);pointer-events:none;background:url(me-red-directions.webp) no-repeat;background-size:300% 300%;background-position:50% 50%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
#panelWrap{position:relative;z-index:2;flex:1 1 auto;min-height:0;padding:0 clamp(70px,7vw,120px) clamp(16px,3vh,40px)}
#panel{height:100%;border-radius:24px;padding:clamp(14px,2.6vh,34px) clamp(20px,2.4vw,42px);background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 24px 50px -28px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.28);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:clamp(18px,3vw,56px);align-items:stretch;overflow:auto}
#panel.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#when{font-size:clamp(16px,2.5vh,28px);font-weight:700;color:#FF5A4D}
#title{margin:clamp(6px,1vh,14px) 0 4px;font-weight:800;font-size:clamp(25px,4.2vh,50px);line-height:1.1;letter-spacing:-.03em}
#org{font-size:clamp(17px,2.8vh,32px);font-weight:600;color:#D8D8D6}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(12px,2.2vh,28px)}
#chips span{font-size:clamp(14px,2.2vh,26px);font-weight:700;padding:clamp(5px,.8vh,10px) clamp(11px,1.2vw,18px);border-radius:999px;background:#2A2A2A;color:#F4F4F2}
#points{display:flex;flex-direction:column;justify-content:space-evenly;height:100%;gap:clamp(6px,1.2vh,16px)}
#points div{display:flex;gap:12px;align-items:flex-start;font-size:clamp(14px,2.4vh,30px);line-height:1.4;font-weight:500}
#points i{flex:0 0 8px;height:8px;margin-top:.55em;background:#E10600}
.cb{position:absolute;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .2s;z-index:5}
.cb:hover:not(:disabled){transform:scale(1.08)}
.cb:disabled{opacity:.35;cursor:default}
#prevB{left:clamp(8px,1.6vw,36px);border:1.5px solid #C0C0C0;background:rgba(30,30,31,.6);color:#F4F4F2}
#nextB{right:clamp(8px,1.6vw,36px);border:0;background:#E10600;color:#fff}
@media (max-width:820px){#panel{grid-template-columns:1fr;overflow:auto}#panelWrap{padding-left:60px;padding-right:60px}}
@media (prefers-reduced-motion:reduce){.dash,.wash{animation:none}#panel.swap{animation:none}}
</style>
<script src="dc-lite.js?v=9"></script>
</head>
<body>
<div id="root">
<div class="wash"></div>
<nav style="position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:24px 56px;flex:0 0 auto">

</div>

<header style="position:relative;z-index:2;padding:30px 40px 0;flex:0 0 auto"><h1>Experience</h1></header>
<section id="road" aria-label="Experience route">
<svg id="svg" aria-hidden="true"></svg>
<div id="rider"></div>
</section>
<div id="panelWrap">
<button id="prevB" class="cb" aria-label="Earlier stop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button id="nextB" class="cb" aria-label="Later stop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<article id="panel">
<div><div id="when"></div><h2 id="title"></h2><div id="org"></div><div id="chips"></div></div>
<div id="points"></div>
</article>
</div>
</div>
<script>
var STOPS=[
{when:'January 2026 to May 2026',lab:'January 2026 to May 2026',where:'Tempe',title:'Undergraduate Teaching Assistant',short:'Undergraduate TA',org:'Arizona State University',points:['Supported students in CSE 360, Introduction to Software Engineering, by answering questions on course material and team projects.','Helped first year students settle into university life and engineering in FSE 100 and ASU 101.','Worked with instructors at Arizona State University to keep each class organized and running smoothly.'],chips:['CSE 360','FSE 100','ASU 101']},
{when:'August 2025 to January 2026',lab:'August 2025 to January 2026',where:'Denver',title:'Software Developer Intern',short:'Software Developer Intern',org:'Neuramod',points:['Cut task completion steps by 40% for 200+ beta users by redesigning 4 mobile workflows and their Firebase data flows.','Served real time operational health data across 3 releases with Firestore schemas and 6 REST APIs on Google Cloud Platform.','Increased daily logging frequency by 25% by shipping Firebase Cloud Messaging push alerts across 3 notification types.','Owned schema design, code reviews and 3 production releases end to end for a health logging app with 200+ users.'],chips:['Firebase','Firestore','Google Cloud','REST APIs','Mobile']},
{when:'January 2026 to May 2026',lab:'January 2026 to May 2026',where:'Austin',title:'Software Engineer Intern',short:'Software Engineer Intern',org:'Endless Moments LLC',points:['Automated candidate screening with bias flagging, using a document extraction pipeline that indexes resumes in Elasticsearch.','Delivered 30+ full stack HR, PTO and benefits pages in 5 sprints with Next.js and TypeScript on REST APIs.','Enabled real time PTO approvals through an event driven WebSockets and Kafka flow, covered by 11 automated and end to end tests.','Hardened PostgreSQL with 28 indexes, 11 constraints and 14 integrity tests, and fixed Docker and Kubernetes networking.','Sped up debugging across the HR, PTO and benefits portals with centralized error logging for every backend service.'],chips:['Next.js','TypeScript','Kafka','PostgreSQL','Elasticsearch','Docker','Kubernetes']},
{when:'August 2026 to present',lab:'August 2026 to present',where:'Los Angeles',title:'AI Engineer',short:'AI Engineer',org:'Mach-AI, DealPilot',points:['Shipped an AI sales lead summary feature that passes all 25 validation snapshots, by designing typed Pydantic API contracts.','Set a 3 second per story configuration by benchmarking Claude Haiku, Sonnet and Opus and prompt engineering 6 story types.','Matched an AI scorer on 23 of 25 leads with no model call, using a deterministic scoring model with 16 unit and integration tests.','Kept 100% of lead results available during model failures with a fallback flow that logs every model call for review.'],chips:['Python','Pydantic','Claude API','Prompt Engineering','Testing']}
];
var FX=[0.09,0.35,0.62,0.89], FY=[0.57,0.27,0.57,0.27];
var cur=STOPS.length-1, pos=null, raf=0, geo=null;
var road=document.getElementById('road'), svg=document.getElementById('svg'), rider=document.getElementById('rider');
var NS='http://www.w3.org/2000/svg';
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function build(){
  var w=road.clientWidth,h=road.clientHeight;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.innerHTML='';
  var pts=[[-30,h*FY[0]]];for(var i=0;i<4;i++)pts.push([w*FX[i],h*FY[i]]);pts.push([w+30,h*FY[3]]);
  var d='M'+pts[0][0]+' '+pts[0][1];
  for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],dx=(b[0]-a[0])*0.5;d+=' C'+(a[0]+dx)+' '+a[1]+' '+(b[0]-dx)+' '+b[1]+' '+b[0]+' '+b[1]}
  var rw=Math.max(34,Math.min(60,h*0.17));
  var g=el('g',{},svg);
  el('path',{d:d,fill:'none',stroke:'rgba(0,0,0,.45)','stroke-width':rw+12,'stroke-linecap':'round',style:'filter:blur(8px)'},g);
  el('path',{d:d,fill:'none',stroke:'#4A4A4D','stroke-width':rw+4,'stroke-linecap':'round'},g);
  var road1=el('path',{d:d,fill:'none',stroke:'#19191A','stroke-width':rw,'stroke-linecap':'round'},g);
  el('path',{d:d,fill:'none',stroke:'#9A9A9C','stroke-width':3,'stroke-dasharray':'12 14','stroke-linecap':'butt','class':'dash'},g);
  var total=road1.getTotalLength();
  var L=[];
  for(var s=0;s<4;s++){var tx=w*FX[s],lo=0,hi=total;for(var it=0;it<26;it++){var m=(lo+hi)/2;if(road1.getPointAtLength(m).x<tx)lo=m;else hi=m}L.push(lo)}
  var prog=el('path',{d:d,fill:'none',stroke:'#E10600','stroke-width':4,'stroke-linecap':'round','stroke-dasharray':'0 '+total,style:'transition:stroke-dasharray .8s cubic-bezier(.2,.7,.2,1)'},g);
  // arrows
  for(var s=0;s<4;s++){
    var a0=s===0?Math.max(0,L[0]-Math.min(160,L[0])):L[s-1], a1=L[s];
    [0.35,0.68].forEach(function(f){addArrow(g,road1,a0+(a1-a0)*f,rw)});
  }
  addArrow(g,road1,Math.min(total-10,L[3]+(total-L[3])*0.55),rw);
  geo={road:road1,total:total,L:L,prog:prog,w:w,h:h};
  // pins and labels
  road.querySelectorAll('.pin,.lab').forEach(function(n){n.remove()});
  STOPS.forEach(function(S,k){
    var x=w*FX[k],y=h*FY[k];
    var p=document.createElement('button');p.className='pin';p.style.left=x+'px';p.style.top=y+'px';p.setAttribute('aria-label',S.title);p.onclick=function(){select(k)};road.appendChild(p);
    var below=FY[k]>0.5;
    var l=document.createElement('button');l.className='lab';l.style.left=x+'px';
    var off=rw/2+16;
    if(below){l.style.top=(y+off)+'px'}else{l.style.bottom=(h-y+off)+'px'}
    l.innerHTML='<div class="d">'+S.lab+'</div><div class="t">'+S.short+'</div><div class="o">'+S.org+'</div>';
    l.onclick=function(){select(k)};road.appendChild(l);
  });
  mark();
  var P=geo.road.getPointAtLength(pos==null?L[cur]:pos);place(P.x,P.y);
  if(pos==null)pos=L[cur];
}
function addArrow(g,path,len,rw){
  var p=path.getPointAtLength(len),q=path.getPointAtLength(len+3),ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
  var s=Math.max(5,rw*0.17);
  el('polyline',{points:(-s)+','+(-s*1.2)+' '+(s*0.7)+',0 '+(-s)+','+(s*1.2),fill:'none',stroke:'#F4F4F2','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round',transform:'translate('+p.x+','+p.y+') rotate('+ang+')',opacity:'.9'},g);
}
function place(x,y){rider.style.left=x+'px';rider.style.top=y+'px'}
function mark(){
  var pins=road.querySelectorAll('.pin'),labs=road.querySelectorAll('.lab');
  pins.forEach(function(p,k){p.className='pin'+(k<cur?' done':'')+(k===cur?' sel':'')});
  labs.forEach(function(l,k){l.className='lab'+(k>cur?' dim':'')});
  if(geo)geo.prog.setAttribute('stroke-dasharray',geo.L[cur]+' '+geo.total);
}
function ride(to){
  if(!geo)return;cancelAnimationFrame(raf);
  var from=pos==null?to:pos,t0=null,dur=800;
  function step(t){if(t0===null)t0=t;var u=Math.min(1,(t-t0)/dur),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;pos=from+(to-from)*e;var P=geo.road.getPointAtLength(pos);place(P.x,P.y);
    var q=geo.road.getPointAtLength(Math.min(geo.total,pos+2));var dir=(to>from)?1:-1;rider.style.backgroundPosition=(u<1?(dir>0?'100% 50%':'0% 50%'):'50% 50%');
    if(u<1)raf=requestAnimationFrame(step)}
  raf=requestAnimationFrame(step);
}
function fill(){
  var S=STOPS[cur];
  document.getElementById('when').textContent=S.where?(S.when+', '+S.where):S.when;
  document.getElementById('title').textContent=S.title;
  document.getElementById('org').textContent=S.org;
  document.getElementById('chips').innerHTML=S.chips.map(function(c){return '<span>'+c+'</span>'}).join('');
  document.getElementById('points').innerHTML=S.points.map(function(t){return '<div><i></i><span>'+t+'</span></div>'}).join('');
  var pn=document.getElementById('panel');pn.classList.remove('swap');void pn.offsetWidth;pn.classList.add('swap');
  document.getElementById('prevB').disabled=cur===0;document.getElementById('nextB').disabled=cur===STOPS.length-1;
}
function select(k){if(k<0||k>=STOPS.length)return;cur=k;mark();fill();ride(geo.L[k])}
document.getElementById('prevB').onclick=function(){select(cur-1)};
document.getElementById('nextB').onclick=function(){select(cur+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')select(cur-1);if(e.key==='ArrowRight')select(cur+1)});
window.addEventListener('resize',function(){pos=null;build()});
window.addEventListener('load',function(){build();fill()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){build()});
</script>
</body>
</html>
