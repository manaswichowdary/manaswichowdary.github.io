<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:inherit}
a:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px;border-radius:4px}
.nl{color:#F4F4F2;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;transition:border-color .2s ease,color .2s ease}
.nl:hover{border-bottom-color:#E10600}
.nl.on{border-bottom-color:#E10600}
.btnr{display:inline-block;background:linear-gradient(180deg,#FF2A20,#E10600 55%,#B80500);color:#FFFFFF;padding:clamp(15px,2vh,21px) clamp(26px,3.1vh,36px);border-radius:999px;font-weight:800;font-size:clamp(18px,2.1vh,24px);white-space:nowrap;text-decoration:none;box-shadow:0 12px 30px -8px rgba(225,6,0,0.75),inset 0 1px 0 rgba(255,255,255,0.4);transition:transform .2s ease,box-shadow .2s ease}
.btnr:hover{transform:translateY(-3px);box-shadow:0 18px 38px -8px rgba(225,6,0,0.9),inset 0 1px 0 rgba(255,255,255,0.4)}
.btng{display:inline-block;border:1.5px solid #F4F4F2;background:#F4F4F2;color:#1E1E1F;padding:clamp(13.5px,1.9vh,19.5px) clamp(24.5px,3vh,34.5px);border-radius:999px;font-weight:800;font-size:clamp(18px,2.1vh,24px);white-space:nowrap;text-decoration:none;box-shadow:0 12px 30px -10px rgba(244,244,242,0.35);transition:transform .2s ease,background .2s ease,color .2s ease}
.btng:hover{background:#FFFFFF;transform:translateY(-3px)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.g1{width:620px;height:620px;left:-160px;top:-120px;background:rgba(225,6,0,0.18);animation:drift1 16s ease-in-out infinite alternate}
.g2{width:520px;height:520px;right:-120px;top:240px;background:rgba(192,192,192,0.14);animation:drift2 20s ease-in-out infinite alternate}
@keyframes drift1{0%{transform:translate(0,0)}100%{transform:translate(220px,160px)}}
@keyframes drift2{0%{transform:translate(0,0)}100%{transform:translate(-200px,-120px)}}
.line{display:block;overflow:visible;padding:0 .2em 6px .12em;margin-left:-.12em}
.line>span{display:block;opacity:0;transform:translateY(40%);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.line.l2>span{animation-delay:.18s}
@keyframes rise{to{transform:translateY(0);opacity:1}}
.metal{color:#F4F4F2}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0% 0}}
.fade{opacity:0;animation:fadeUp .9s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.swing{transform-origin:50% 0;animation:swingIn 3.2s cubic-bezier(.3,.6,.4,1) .3s 1 both}
.swing:hover{animation:sway 5s ease-in-out infinite}
@keyframes swingIn{0%{transform:rotate(11deg)}18%{transform:rotate(-7deg)}36%{transform:rotate(4.5deg)}54%{transform:rotate(-2.5deg)}72%{transform:rotate(1.3deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%{transform:rotate(0deg)}25%{transform:rotate(2.2deg)}75%{transform:rotate(-2.2deg)}100%{transform:rotate(0deg)}}
.gloss{position:absolute;top:0;right:0;bottom:0;left:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,0.6) 47%,rgba(255,255,255,0.14) 53%,transparent 62%);background-size:260% 100%;background-position:150% 0;animation:glossMove 6s ease-in-out 1.6s infinite}
.sheen{position:absolute;top:0;right:0;left:0;height:46%;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0.55),rgba(255,255,255,0));opacity:0.55}
@keyframes glossMove{0%{background-position:150% 0}38%,100%{background-position:-50% 0}}
.mascot{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.scene{width:380px;height:610px;margin-top:-6px;perspective:1600px;cursor:pointer;outline:none}
.scene:focus-visible .flipper{box-shadow:0 0 0 3px #FFFFFF}
.flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.8,.2,1);border-radius:26px}
.scene:hover .flipper{filter:drop-shadow(0 30px 40px rgba(225,6,0,0.35))}
.scene{animation:openSpin 1.6s cubic-bezier(.2,.8,.2,1) .3s 1 both}
@keyframes openSpin{0%{transform:rotateY(-100deg);opacity:0}30%{opacity:1}100%{transform:rotateY(0deg)}}
.cface{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:26px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 40px 70px -20px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.9)}
.cface.front{background:linear-gradient(160deg,#FFFFFF 0%,#F4F4F2 42%,#E2E2E0 100%)}
.cface.back{transform:rotateY(180deg);background:radial-gradient(ellipse at 50% 120%,rgba(225,6,0,0.7),transparent 65%),linear-gradient(160deg,#3A3A3C,#1E1E1F)}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.tick{display:flex;width:max-content;animation:scrollL 38s linear infinite}
.tick span{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;white-space:nowrap;padding:0 26px;color:#C0C0C0}
.tick i{color:#E10600;font-style:normal;font-weight:800}
@keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.strip{overflow:hidden;padding:56px 0 64px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{display:flex;gap:34px;width:max-content;padding:20px 17px;animation:scrollL 70s linear infinite}
.strip:hover .track{animation-play-state:paused}
.pc{flex:0 0 300px;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.pc:nth-child(odd){transform:rotate(-1.8deg)}
.pc:nth-child(even){transform:rotate(1.6deg) translateY(10px)}
.pc:hover{transform:rotate(0deg) translateY(-18px) scale(1.05)}
.pframe{padding:8px;border-radius:30px;background:linear-gradient(160deg,#FFFFFF,#D9D9D7);box-shadow:0 30px 50px -22px rgba(0,0,0,0.9)}
.pin{position:relative;height:380px;border-radius:23px;overflow:hidden;background-color:#222223;background-image:radial-gradient(ellipse at 50% 120%,rgba(225,6,0,0.6),transparent 65%),repeating-linear-gradient(0deg,rgba(255,255,255,0.04) 0,rgba(255,255,255,0.04) 2px,transparent 2px,transparent 15px);padding:26px 22px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}
.pin:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,0.18) 48%,transparent 60%);pointer-events:none}
.pill{display:flex;gap:0;margin:16px auto 0;width:max-content;background:#2A2A2B;border:1px solid #4A4A4C;border-radius:14px}
.pill div{padding:9px 18px;text-align:center;font-size:12px;color:#C0C0C0;border-left:1px solid #4A4A4C}
.pill div:first-child{border-left:0}
.pill b{display:block;font-size:17px;color:#FFFFFF}
.wc{background:linear-gradient(160deg,rgba(255,255,255,0.85),rgba(255,255,255,0.4)) !important;-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 20px 40px -26px rgba(0,0,0,0.4),inset 0 1px 0 #FFFFFF;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}
.wc:hover{transform:translateY(-8px);border-color:#E10600;box-shadow:0 24px 50px -24px rgba(225,6,0,0.7)}
@media (prefers-reduced-motion:reduce){.swing,.swing:hover,.gloss,.tick,.track,.metal,.glow,.line>span,.fade{animation:none}.line>span{transform:none;opacity:1}.fade{opacity:1}}

@media (max-width:860px){.hero{flex-wrap:wrap !important}}
.rise-h{animation:riseH .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes riseH{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.fadeIn{animation:riseH .9s ease both}
.orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb.r{background:rgba(225,6,0,0.30)}.orb.s{background:rgba(192,192,192,0.14)}
.o1{animation:oA 18s ease-in-out infinite alternate}.o2{animation:oB 22s ease-in-out infinite alternate}
@keyframes oA{0%{transform:translate(0,0)}100%{transform:translate(240px,180px)}}
@keyframes oB{0%{transform:translate(0,0)}100%{transform:translate(-220px,-140px)}}
.gl{transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}
.gl:hover{transform:translateY(-8px);border-color:rgba(255,255,255,0.45);box-shadow:0 28px 50px -24px rgba(225,6,0,0.55)}
.rbtn{display:inline-block;background:linear-gradient(180deg,#FF2A20,#E10600 55%,#B80500);color:#fff;padding:14px 26px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 12px 30px -8px rgba(225,6,0,0.7),inset 0 1px 0 rgba(255,255,255,0.4);transition:transform .2s ease}
.rbtn:hover{transform:translateY(-3px)}
.shine{position:relative;overflow:hidden}
.shine:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,0.22) 50%,transparent 62%);background-size:260% 100%;background-position:150% 0;animation:shn 7s ease-in-out infinite;pointer-events:none}
@keyframes shn{0%{background-position:150% 0}40%,100%{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.rise-h,.fadeIn,.orb,.shine:after{animation:none}}
.wash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 14% 8%,rgba(225,6,0,0.20),transparent 28%),radial-gradient(circle at 88% 38%,rgba(192,192,192,0.16),transparent 34%),radial-gradient(circle at 24% 88%,rgba(225,6,0,0.12),transparent 30%);background-size:170% 170%;animation:washMove 16s ease-in-out infinite alternate}
@keyframes washMove{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.orb.r{background:rgba(225,6,0,0.22)}.orb.s{background:rgba(192,192,192,0.14)}
@media (prefers-reduced-motion:reduce){.wash{animation:none}}
.wp{fill:none;stroke:#C8C8C6;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:240 1900;opacity:.34;animation:windFlow 12s linear infinite,windSway 7s ease-in-out infinite alternate}
@keyframes windFlow{from{stroke-dashoffset:2140}to{stroke-dashoffset:0}}
@keyframes windSway{from{transform:translateY(-14px)}to{transform:translateY(16px)}}
.lt{display:inline-block;padding:.14em .22em .14em .14em;margin:-.14em -.22em -.14em -.14em;color:#F4F4F2;animation:wave 3.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.wp,.lt{animation:none}}
@media (min-width:1100px){.tl{display:block;white-space:nowrap}}
