<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manaswi Makkena</title>
<style>html{scroll-behavior:smooth;background:#141415}body{margin:0;background:#141415}
section{display:block;width:100%;overflow:hidden}iframe{display:block;width:100%;border:0;height:900px;background:#141415}</style></head>
<body>
<section id="home"><iframe src="home.html" title="Home"></iframe></section>
<section id="about"><iframe src="about.html" title="About me"></iframe></section>
<section id="education"><iframe src="education.html" title="Education"></iframe></section>
<section id="experience"><iframe src="experience.html" title="Experience"></iframe></section>
<section id="projects"><iframe src="projects.html" title="Projects"></iframe></section>
<section id="skills"><iframe src="skills.html" title="Skills"></iframe></section>
<section id="contact"><iframe src="contact.html" title="Contact"></iframe></section>
<script>
var MAP={'index':'home','home':'home','about':'about','education':'education','experience':'experience','projects':'projects','skills':'skills','contact':'contact'};
function go(id,push){var el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'start'});if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}}
document.querySelectorAll('iframe').forEach(function(f){
  function fit(){try{var d=f.contentDocument;if(!d||!d.body)return;var h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight);if(h&&Math.abs(h-f.offsetHeight)>1)f.style.height=h+'px';}catch(e){}}
  f.addEventListener('load',function(){
    var d=f.contentDocument;if(!d)return;
    d.documentElement.style.overflow='hidden';
    d.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
      var h=a.getAttribute('href')||'';var m=h.match(/^([a-z]+)\.html/i);
      if(m&&MAP[m[1].toLowerCase()]){e.preventDefault();go(MAP[m[1].toLowerCase()],true);}
      else if(/^https?:|^mailto:/.test(h)&&!a.target){a.target='_blank';a.rel='noopener';}
    });
    fit();setInterval(fit,500);
    if(window.ResizeObserver)new ResizeObserver(fit).observe(d.body);
    if(f.title==='Home'&&location.hash)setTimeout(function(){go(location.hash.slice(1))},300);
  });
});
window.addEventListener('hashchange',function(){go(location.hash.slice(1))});
</script></body></html>
